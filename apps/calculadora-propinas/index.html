<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Calculadora de propinas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Calculadora de propinas</h1>
    <form id="tip-form" novalidate autocomplete="off">
      <div class="field">
        <label for="bill">Monto de la cuenta</label>
        <input id="bill" name="bill" type="text" inputmode="decimal" autocomplete="off" aria-describedby="bill-error">
        <p id="bill-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="tipPercent">Propina (%)</label>
        <input id="tipPercent" name="tipPercent" type="text" inputmode="decimal" autocomplete="off" value="15" aria-describedby="tipPercent-error">
        <p id="tipPercent-error" class="error" aria-live="polite"></p>
        <div class="shortcuts" role="group" aria-label="Porcentajes rápidos">
          <button type="button" class="chip" aria-pressed="false" data-tip="10">10%</button>
          <button type="button" class="chip" aria-pressed="false" data-tip="15">15%</button>
          <button type="button" class="chip" aria-pressed="false" data-tip="18">18%</button>
          <button type="button" class="chip" aria-pressed="false" data-tip="20">20%</button>
        </div>
      </div>

      <div class="field">
        <label for="people">Número de personas</label>
        <input id="people" name="people" type="text" inputmode="numeric" autocomplete="off" value="1" aria-describedby="people-error">
        <p id="people-error" class="error" aria-live="polite"></p>
      </div>

      <button type="button" id="reset" class="btn-secondary">Limpiar</button>
    </form>

    <section class="results" aria-live="polite" aria-labelledby="results-title">
      <h2 id="results-title" class="visually-hidden">Resultados</h2>
      <p id="empty-state" class="empty">Ingresa el monto de la cuenta para ver el resultado</p>
      <dl id="results-list" class="results-list" hidden>
        <div class="row"><dt>Propina total</dt><dd id="tip-total"></dd></div>
        <div class="row highlight"><dt>Total a pagar</dt><dd id="total" class="big"></dd></div>
        <div class="row highlight"><dt>Por persona</dt><dd id="per-person" class="big"></dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
