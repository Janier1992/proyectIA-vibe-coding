name: Validar motor agéntico

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar consistencia del motor
        run: bash .claude/scripts/validate-engine.sh
